        }

        // إعفاء 6.72 من فحص البورت لتوفير الذاكرة
        if (fwNum === 6.72) {
            startJailbreak();
            return;
        }

        fetch("http://127.0.0.1:9090/", { mode: 'no-cors' })
            .then(() => {
                sessionStorage.setItem('monika_jb_done', 'true');
                showTools("Welcome back! GoldHen is already loaded, silly~ Need a payload, or did you come to spend time with me?");
            })
            .catch(() => {
                startJailbreak();
            });
    }

    if (window.applicationCache) {
        var cacheTimeout = setTimeout(function() {
            if (!isCaching) checkGoldHenAndStart();
        }, 3000);

        window.applicationCache.addEventListener("downloading", function() {
            isCaching = true;
            clearTimeout(cacheTimeout);
        }, false);

        window.applicationCache.addEventListener("progress", function(e) {
            isCaching = true;
            clearTimeout(cacheTimeout); 
            if (!isPS4) return;
            var Percent = (Math.round(e.loaded / e.total * 100));
            var msgsBox = document.getElementById('msgs');
            if(msgsBox) msgsBox.innerHTML = "Installing Offline Cache: " + Percent + "%";
        }, false);

        window.applicationCache.oncached = function(e){ 
            clearTimeout(cacheTimeout);
            isCaching = false;
            if (!isPS4) return;
            var msgsBox = document.getElementById('msgs');
            if(msgsBox) {
                msgsBox.innerHTML = "Cache Installed Successfully !";
                msgsBox.style.borderColor = "#00ff88";
                setTimeout(checkGoldHenAndStart, 1500);
            }
        };

        window.applicationCache.onnoupdate = function(e){
            clearTimeout(cacheTimeout);
            isCaching = false;
            if (!isPS4) return;
            checkGoldHenAndStart();
        };

        window.applicationCache.onupdateready = function(e){ 
            clearTimeout(cacheTimeout);
            isCaching = false;
            if (!isPS4) return;
            window.applicationCache.swapCache();
            location.reload();
        };

        window.applicationCache.onerror = function(e){ 
            clearTimeout(cacheTimeout);
            isCaching = false;
            if (!isPS4) return;
            checkGoldHenAndStart();
        };
    }

    document.addEventListener("DOMContentLoaded", () => {
        var msgsBox = document.getElementById('msgs');
        
         if (!isPS4) {
            msgsBox.innerHTML = "This page is strictly for PlayStation. What are you doing here? Don't you know Monika is watching you?";
            msgsBox.style.borderColor = "red";
            return;
        }

        if (fwNum < 5.05 || fwNum > 14.00) {
            msgsBox.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>. Monika only loves 5.05 to 14.00!';
            msgsBox.style.borderColor = "red";
            return;
        }
        
        if (!window.applicationCache) {
            checkGoldHenAndStart();
        }
    });

    function loadPayload(payloadPath, toolName) {
        const msgsBox = document.getElementById('msgs');
        msgsBox.innerHTML = toolName + " is loading by monika...";
        msgsBox.style.borderColor = "#ff99c2";
        
        var getReq = new XMLHttpRequest();
        getReq.open('GET', payloadPath, true);
        getReq.responseType = 'arraybuffer';
        
        getReq.onload = function() {
            if (getReq.status === 200) {
                var payloadData = getReq.response;
                var sendReq = new XMLHttpRequest();
                sendReq.open('POST', 'http://127.0.0.1:9090/', true);
                sendReq.onload = function() {
                    if (toolName === "Disable Updates") {
                        msgsBox.innerHTML = toolName + " is loaded by monika, enjoy using internet safely !";
                    } else if (toolName === "Enable Updates") {
                        msgsBox.innerHTML = toolName + " is loaded by monika";
                    } else {
                        msgsBox.innerHTML = toolName + " is loaded by monika, enjoy !";
                    }
                    msgsBox.style.borderColor = "#00ff88";
                };
                sendReq.onerror = function() {
                    msgsBox.innerHTML = toolName + " failed! (Please enable BinLoader in GoldHEN settings)";
                    msgsBox.style.borderColor = "red";
                };
                sendReq.send(payloadData);
            } else {
                msgsBox.innerHTML = "Error: Payload file not found!";
                msgsBox.style.borderColor = "red";
            }
        };
        getReq.onerror = function() {
            msgsBox.innerHTML = "Error fetching the payload!";
            msgsBox.style.borderColor = "red";
        };
        getReq.send();
    }
    </script>
